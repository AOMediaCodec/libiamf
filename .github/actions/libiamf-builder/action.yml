name: libiamf-builder

description: Build libiamf.

inputs:
  build-options:
    description: Build command options.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        git submodule update --init --recursive
        cd code
        cmake -B build ${{ inputs.build-options }} .
        cmake --build build

